[package]
name = "intent-database"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
sled = "0.34"
tempfile = { version = "3", optional = true }
bincode = "1.3"
once_cell = "1.21"
reqwest = { version = "0.11", optional = true, features = [
    "json",
    "blocking",
    "rustls-tls",
] }
tiny_http = "0.12"

[features]
http-model-adapter = ["reqwest"]
gemini-model-adapter = ["reqwest"]

[[bin]]
name = "web_server"
path = "src/bin/web_server.rs"

[[bin]]
name = "bench_persist"
path = "src/bin/bench_persist.rs"

[[bin]]
name = "bench_find_similar"
path = "src/bin/bench_find_similar.rs"

[[bin]]
name = "lint_rules"
path = "src/bin/lint_rules.rs"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.11", features = ["json"], optional = false }
assert_cmd = "2"
tokio = { version = "1", features = ["macros", "rt"] }
criterion = "0.4"
